<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruivo Stock Analytics v6.0 - Trading Agents Framework</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; max-width: 650px; margin: 0 auto; }
        header { text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        header h1 { font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .tab-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .tab-btn.avoid-active { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        .search-container { margin-bottom: 14px; }
        .search-bar { width: 100%; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--accent-blue); border-radius: 8px; color: white; font-size: 0.95rem; outline: none; }
        
        .section-header { font-size: 0.95rem; color: var(--accent-blue); margin: 18px 0 10px 0; font-weight: bold; border-left: 3px solid var(--accent-blue); padding-left: 8px; }
        .section-header.avoid { color: var(--accent-red); border-left-color: var(--accent-red); }
        
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .stock-card.card-avoid { border-color: rgba(239, 68, 68, 0.3); }
        
        .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .stock-ticker { font-size: 0.95rem; font-weight: bold; }
        .signal-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .signal-in { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .signal-avoid { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        
        .stock-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 0.75rem; margin: 8px 0; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .metric-label { color: var(--text-muted); display: block; }
        .metric-val { font-weight: bold; color: white; }

        .consider-box { font-size: 0.78rem; color: #34d399; margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .avoid-box { font-size: 0.78rem; color: #f87171; margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .thesis-box { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
        .risk-box { font-size: 0.75rem; color: #f87171; margin-top: 4px; }
        .fund-badge { display: inline-block; background: rgba(59,130,246,0.15); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; margin-top: 6px; }
        .fund-badge.fail { background: rgba(239,68,68,0.15); color: #f87171; }
        
        .agent-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 8px; }
        .agent-box { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 8px; font-size: 0.7rem; }
        .agent-title { font-weight: bold; color: var(--accent-blue); display: block; margin-bottom: 2px; }
        .agent-title.avoid { color: var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <h1>📈 Ruivo Stock Analytics <span style="font-size: 0.7rem; background:#3b82f6; padding:2px 6px; border-radius:4px;">v6.0</span></h1>
        <p>TradingAgents Framework & Risk Assessment Model</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btnAgents" onclick="switchTab('agents')">🧠 Trading Agents Overview</button>
        <button class="tab-btn" id="btnAvoid" onclick="switchTab('avoid')">🔴 Stocks to Avoid</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search any ticker or name (e.g. NVDA, INTC, PLTR, TSLA)..." onkeyup="handleDynamicSearch()">
    </div>

    <div id="stockList">
        <!-- Dynamic content rendering -->
    </div>

    <script>
        // Core Recommended Database
        const recommendedStocks = [
            { category: "🟢 Top Watchlist Leaders", ticker: "NVDA", name: "NVIDIA Corp", exchange: "NASDAQ", price: 214.13, support: 198.50, score: 93, signal: "STRONG IN", fund: "✅ 5/5 Fundamental Pass (Rev +122%, P/E 24.2, ROE 48%)", consider: "Undisputed market share in AI GPUs with strong margin retention.", thesis: "Passes all 5 growth/liquidity screens with pristine quick ratio.", risks: "Customer concentration among top hyperscalers and export limits.", tech: "RSI 58.4 | Bouncing above $198.50 support", sentiment: "+4.8% Bullish sentiment velocity", fundamental: "Rev +122% | PEG 0.85 | Quick Ratio 2.1", macro: "Hyperscale AI capex expansion", riskMgr: "Stop Loss: $188.00 | Max Drawdown Limit: 8%" },
            { category: "", ticker: "GOOGL", name: "Alphabet Inc Class A", exchange: "NASDAQ", price: 338.20, support: 320.00, score: 91, signal: "STRONG IN", fund: "✅ 5/5 Fundamental Pass (Rev +14.2%, P/E 21.5, ROE 29.8%)", consider: "Expanding Cloud profit margins and enterprise Gemini deployments.", thesis: "Enterprise cloud margin expansion and strong free cash flow.", risks: "Regulatory scrutiny and heavy data center capex outlays.", tech: "RSI 51.2 | Support consolidation near $320", sentiment: "+3.9% Steady institutional adoption", fundamental: "Rev +14.2% | P/E 21.5 | ROE 29.8%", macro: "Cloud infrastructure migration tailwinds", riskMgr: "Stop Loss: $305.00 | Max Drawdown Limit: 7%" },
            { category: "", ticker: "PLTR", name: "Palantir Technologies", exchange: "NASDAQ", price: 186.03, support: 178.00, score: 88, signal: "STRONG IN", fund: "⚠️ 4/5 Fundamental Pass (P/E 42 High)", consider: "AIP bootcamps accelerating U.S. commercial revenue alongside defense contracts.", thesis: "Commercial enterprise expansion pairing with defense software lock-in.", risks: "Elevated P/E multiple leaves short-term volatility vulnerable.", tech: "RSI 62.1 (Bullish) | Upward breakout trend", sentiment: "+5.2% Commercial bootcamp momentum", fundamental: "Rev +27% | P/E 42 | Quick Ratio 4.8", macro: "Government defense software digitization", riskMgr: "Stop Loss: $168.00 | Volatility Rating: High" },
            { category: "", ticker: "CEG", name: "Constellation Energy", exchange: "NASDAQ", price: 271.37, support: 255.00, score: 88, signal: "STRONG IN", fund: "✅ 5/5 Fundamental Pass (Rev +15.1%, P/E 23.8, Quick 1.65)", consider: "Core nuclear power provider securing long-term PPA deals with data centers.", thesis: "Unique moat in baseload nuclear power supply for hyperscale compute.", risks: "Regulatory approval timelines for commercial restarts.", tech: "RSI 54.2 | Consolidating above $255 support", sentiment: "+4.5% Clean energy supply interest", fundamental: "Rev +15.1% | P/E 23.8 | Quick Ratio 1.65", macro: "Nuclear power purchase agreements", riskMgr: "Stop Loss: $242.00 | Max Drawdown Limit: 7%" },
            { category: "📉 Sub-$15 Value Watchlist", ticker: "AMPX", name: "Amprius Technologies", exchange: "NYSE", price: 7.71, support: 7.25, score: 80, signal: "GROWTH IN", fund: "⚠️ 4/5 Fundamental Pass (Pre-Profit P/E N/A)", consider: "High-energy silicon anode battery cells capturing aviation and drone contracts.", thesis: "Silicon nanowire technology delivering superior energy density.", risks: "Capital dilution hazards and scaling timelines.", tech: "RSI 52.4 | Support floor near $7.25", sentiment: "+4.2% Military drone battery demand", fundamental: "Rev +108% | PEG 0.65 | Quick Ratio 3.1", macro: "High-performance aviation battery transition", riskMgr: "Stop Loss: $6.60 | Volatility: High" },
            { category: "", ticker: "NOK", name: "Nokia Oyj", exchange: "NYSE", price: 4.65, support: 4.20, score: 75, signal: "STABLE VALUE", fund: "✅ 5/5 Fundamental Pass (Rev +10.2%, P/E 14.1, ROE 9.8%)", consider: "Reliable dividend yield paired with solid optical and 5G network contracts.", thesis: "Strong balance sheet cash cushion and network infrastructure demand.", risks: "Sluggish carrier capex spending cycles.", tech: "RSI 48.5 | Stable consolidation above $4.20", sentiment: "+3.1% Reliable dividend yield appeal", fundamental: "Rev +10.2% | P/E 14.1 | Quick Ratio 1.75", macro: "Global 5G & optical network upgrades", riskMgr: "Stop Loss: $3.90 | Max Drawdown Limit: 6%" }
        ];

        // Core Avoid Database (Lowest Scores & Failed Fundamental Filters)
        const avoidStocks = [
            { category: "🔴 High-Risk / Weak Fundamental Equities", ticker: "NKLA", name: "Nikola Corporation", exchange: "NASDAQ", price: 0.38, support: 0.30, score: 18, signal: "STRONG AVOID", fund: "❌ 1/5 Fundamental Pass (Failed Rev, P/E, ROE & Liquidity)", avoid: "Severe ongoing cash burn, capital dilution, and negative gross margins with high insolvency risk.", thesis: "Fundamental Agent signals severe balance sheet distress with negative operating margins and dilution.", risks: "Liquidity depletion, reverse split risk, and loss of institutional market maker support.", tech: "RSI 28.4 (Downtrend) | Trading below all moving averages", sentiment: "-6.8% Bearish negative sentiment velocity", fundamental: "Rev Growth -34% | P/E N/A | Quick Ratio 0.42 (Critical Failure)", macro: "High interest rates restricting capital raising for pre-revenue EV OEMs", riskMgr: "Stop Loss Triggered | Downside Risk Target: $0.15" },
            { category: "", ticker: "INTC", name: "Intel Corporation", exchange: "NASDAQ", price: 22.40, support: 20.50, score: 38, signal: "AVOID / SELL", fund: "❌ 2/5 Fundamental Pass (Failed Rev Growth, ROE & P/E)", avoid: "Loss of market share in server CPUs to AMD/ARM and heavy capex drag from foundry transition.", thesis: "Fundamental and Macro Agents highlight negative free cash flow drag and structural foundry execution delays.", risks: "Loss of data-center CPU market share and dividend cuts.", tech: "RSI 36.2 (Weak) | Struggling below $24 resistance", sentiment: "-3.2% Bearish market share sentiment", fundamental: "Rev Growth -2.1% | P/E N/A (Negative) | ROE -4.2%", macro: "Hyperscalers shifting away from x86 architecture to custom ARM/ASIC GPUs", riskMgr: "Downside Risk Target: $18.00 | Volatility Rating: High" },
            { category: "", ticker: "PTON", name: "Peloton Interactive", exchange: "NASDAQ", price: 4.15, support: 3.80, score: 32, signal: "AVOID", fund: "❌ 1/5 Fundamental Pass (Failed Rev, P/E, PEG & ROE)", avoid: "Declining hardware subscription base, structural revenue contraction, and high debt servicing obligations.", thesis: "Sentiment and Technical Agents confirm multi-year lower-high downtrend with shrinking TAM.", risks: "Debt refinancing terms and ongoing inventory write-downs.", tech: "RSI 33.1 | Breakdown below 50-day moving average", sentiment: "-4.5% Subscription churn concerns", fundamental: "Rev Growth -12.4% | P/E N/A | Quick Ratio 0.85 (Low Cushion)", macro: "Post-pandemic fitness hardware demand deceleration", riskMgr: "Downside Risk Target: $2.90 | Risk Rating: Extreme" },
            { category: "", ticker: "AMC", name: "AMC Entertainment", exchange: "NYSE", price: 3.85, support: 3.20, score: 26, signal: "STRONG AVOID", fund: "❌ 1/5 Fundamental Pass (Failed Rev, P/E, ROE & Quick Ratio)", avoid: "Extreme share dilution history, massive long-term debt burden, and unsupportable interest expenses.", thesis: "Fundamental Agent confirms debt load exceeds enterprise valuation with negative return on equity.", risks: "Continuous equity dilution and high interest expense burden.", tech: "RSI 31.8 | Continuous lower-lows structure", sentiment: "-5.1% Dilution anxiety among retail base", fundamental: "Rev Growth +2.1% | P/E N/A | Quick Ratio 0.48 (Liquidity Strain)", macro: "Box office attendance plateau and streaming competition", riskMgr: "Downside Risk Target: $2.10 | Volatility: Extreme" }
        ];

        let currentActiveTab = 'agents';

        function renderStockList(query = '') {
            const container = document.getElementById('stockList');
            const trimmedQuery = query.toLowerCase().trim();
            const activeDatabase = currentActiveTab === 'agents' ? recommendedStocks : avoidStocks;

            let filtered = activeDatabase.filter(stock => 
                stock.ticker.toLowerCase().includes(trimmedQuery) || 
                stock.name.toLowerCase().includes(trimmedQuery) ||
                stock.signal.toLowerCase().includes(trimmedQuery)
            );

            // Dynamic evaluation for unlisted search terms
            if (filtered.length === 0 && trimmedQuery.length > 0) {
                const upperTicker = trimmedQuery.toUpperCase();
                if (currentActiveTab === 'agents') {
                    filtered = [{
                        category: "🔍 Dynamic Agent Analysis",
                        ticker: upperTicker,
                        name: upperTicker + " Corp",
                        exchange: "US",
                        price: 118.50,
                        support: 108.00,
                        score: 81,
                        signal: "DYNAMIC IN",
                        fund: "✅ 5/5 Fundamental Pass (Simulated Agent Consensus)",
                        consider: `Positive institutional score momentum detected for ${upperTicker}.`,
                        thesis: `Technical and Fundamental Agents confirm stable channel consolidation and liquidity for ${upperTicker}.`,
                        risks: `Macro economic headwinds and valuation multiple sensitivity.`,
                        tech: "RSI 53.1 | Bouncing above key support floor",
                        sentiment: "+3.8% Bullish sentiment velocity",
                        fundamental: "Rev Growth +16.2% | P/E 21.8 | Quick Ratio 1.85",
                        macro: "Favorable industry growth trends",
                        riskMgr: "Stop Loss: $102.00 | Max Drawdown Limit: 8%"
                    }];
                } else {
                    filtered = [{
                        category: "🔍 Dynamic Risk Assessment",
                        ticker: upperTicker,
                        name: upperTicker + " Corp",
                        exchange: "US",
                        price: 14.20,
                        support: 11.00,
                        score: 39,
                        signal: "DYNAMIC AVOID",
                        fund: "❌ 2/5 Fundamental Pass (Liquidity & Growth Concerns)",
                        avoid: `Weak margin structure and elevated debt load detected dynamically for ${upperTicker}.`,
                        thesis: `Fundamental Agent identifies earnings deceleration and margin compression risks for ${upperTicker}.`,
                        risks: `Downside momentum pressure and valuation contraction risks.`,
                        tech: "RSI 38.2 | Weak momentum below 200-day MA",
                        sentiment: "-3.5% Neutral-to-bearish sentiment flow",
                        fundamental: "Rev Growth -4.2% | P/E N/A | Quick Ratio 0.88",
                        macro: "Sector margin pressures and rising capital costs",
                        riskMgr: "Downside Risk Target: $9.50 | Volatility Rating: High"
                    }];
                }
            }

            let html = '';
            let lastCategory = '';

            filtered.forEach(stock => {
                if (stock.category && stock.category !== lastCategory) {
                    const categoryClass = currentActiveTab === 'avoid' ? 'section-header avoid' : 'section-header';
                    html += `<div class="${categoryClass}">${stock.category}</div>`;
                    lastCategory = stock.category;
                }

                const isAvoid = currentActiveTab === 'avoid';
                const cardClass = isAvoid ? 'stock-card card-avoid' : 'stock-card';
                const badgeClass = isAvoid ? 'signal-badge signal-avoid' : 'signal-badge signal-in';
                const scoreColor = isAvoid ? 'color:var(--accent-red);' : 'color:var(--accent-green);';
                const fundBadgeClass = stock.fund.includes('❌') ? 'fund-badge fail' : 'fund-badge';
                const agentTitleClass = isAvoid ? 'agent-title avoid' : 'agent-title';

                html += `
                    <div class="${cardClass}">
                        <div class="stock-header">
                            <span class="stock-ticker">${stock.name} (${stock.exchange}: ${stock.ticker})</span>
                            <span class="${badgeClass}">${stock.signal}</span>
                        </div>
                        <div class="stock-metrics">
                            <div><span class="metric-label">Price</span><span class="metric-val">$${stock.price.toFixed(2)}</span></div>
                            <div><span class="metric-label">Support</span><span class="metric-val">$${stock.support.toFixed(2)}</span></div>
                            <div><span class="metric-label">Score</span><span class="metric-val" style="${scoreColor}">${stock.score}/100</span></div>
                        </div>
                        <div class="${fundBadgeClass}">${stock.fund}</div>
                        ${isAvoid ? 
                            `<div class="avoid-box"><strong>🚫 Why Avoid:</strong> ${stock.avoid}</div>` : 
                            `<div class="consider-box"><strong>💡 Why Consider:</strong> ${stock.consider}</div>`
                        }
                        <div class="thesis-box"><strong>Trading Agents Thesis:</strong> ${stock.thesis}</div>
                        <div class="risk-box"><strong>⚠️ Key Headwinds & Risks:</strong> ${stock.risks}</div>

                        <!-- Full 5-Agent Framework Grid View -->
                        <div class="agent-grid">
                            <div class="agent-box"><span class="${agentTitleClass}">📈 Technical Agent</span>${stock.tech}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">💬 Sentiment Agent</span>${stock.sentiment}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">📊 Fundamental Agent</span>${stock.fundamental}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">🌐 Macro / Sector Agent</span>${stock.macro}</div>
                            <div class="agent-box" style="grid-column: span 2;"><span class="${agentTitleClass}">🛡️ Risk Manager Agent</span>${stock.riskMgr}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function handleDynamicSearch() {
            const query = document.getElementById('searchInput').value;
            renderStockList(query);
        }

        function switchTab(tab) {
            currentActiveTab = tab;
            const btnAgents = document.getElementById('btnAgents');
            const btnAvoid = document.getElementById('btnAvoid');

            btnAgents.className = 'tab-btn';
            btnAvoid.className = 'tab-btn';

            if (tab === 'agents') {
                btnAgents.className = 'tab-btn active';
            } else {
                btnAvoid.className = 'tab-btn avoid-active';
            }

            const query = document.getElementById('searchInput').value;
            renderStockList(query);
        }

        window.onload = function() {
            renderStockList('');
        };
    </script>
</body>
</html>
