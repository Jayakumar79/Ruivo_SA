<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruivo Stock Analytics v9.5 - Fully Functional Watchlist</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; max-width: 680px; margin: 0 auto; }
        header { text-align: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 14px; }
        header h1 { font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
        
        .add-ticker-bar { display: flex; gap: 6px; margin-bottom: 12px; }
        .add-input { flex: 1; padding: 8px 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; font-size: 0.8rem; outline: none; }
        .add-btn { background: var(--accent-blue); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .sync-btn { background: #059669; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        .nav-tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .tab-btn.avoid-active { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        .search-container { margin-bottom: 14px; }
        .search-bar { width: 100%; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--accent-blue); border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
        
        .section-header { font-size: 0.9rem; color: var(--accent-blue); margin: 16px 0 8px 0; font-weight: bold; border-left: 3px solid var(--accent-blue); padding-left: 8px; }
        .section-header.avoid { color: var(--accent-red); border-left-color: var(--accent-red); }
        
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .stock-card.card-avoid { border-color: rgba(239, 68, 68, 0.3); }
        
        .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .stock-ticker { font-size: 0.92rem; font-weight: bold; }
        .signal-badge { padding: 3px 6px; border-radius: 6px; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; }
        .signal-in { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .signal-avoid { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        
        .stock-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 0.72rem; margin: 6px 0; background: rgba(0,0,0,0.2); padding: 6px 8px; border-radius: 6px; }
        .metric-label { color: var(--text-muted); display: block; }
        .metric-val { font-weight: bold; color: white; }

        .investor-box { font-size: 0.72rem; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; color: #93c5fd; }
        .consider-box { font-size: 0.75rem; color: #34d399; margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .avoid-box { font-size: 0.75rem; color: #f87171; margin-top: 6px; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .thesis-box { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; line-height: 1.35; }
        .risk-box { font-size: 0.72rem; color: #f87171; margin-top: 4px; }
        .fund-badge { display: inline-block; background: rgba(59,130,246,0.15); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; margin-top: 4px; }
        .fund-badge.fail { background: rgba(239,68,68,0.15); color: #f87171; }
        
        .agent-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; border-top: 1px dashed var(--border-color); padding-top: 6px; }
        .agent-box { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 5px 7px; font-size: 0.68rem; }
        .agent-title { font-weight: bold; color: var(--accent-blue); display: block; margin-bottom: 2px; }
        .agent-title.avoid { color: var(--accent-red); }

        .stats-table-wrapper { overflow-x: auto; margin-top: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px; }
        .stats-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; text-align: left; }
        .stats-table th { color: var(--accent-blue); padding: 8px 6px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        .stats-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        .stats-table tr:hover { background: rgba(255,255,255,0.02); }
        .live-tag { font-size: 0.6rem; background: #10b981; color: black; padding: 1px 4px; border-radius: 3px; margin-left: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <header>

            { ticker: "FORTUM", name: "Fortum Oyj", exchange: "HEL", basePrice: 15.20, isWatchlist: true, revGrowth: 4.5, pe: 11.8, peg: 1.55, roe: 14.5, quick: 1.6, topHolders: "Solidium (51.2%), Ilmarinen (3.4%)", flow3Day: "+290K bought", consider: "Nordic clean energy leader producing zero-carbon nuclear/hydro.", thesis: "Stable defensive utility cash flows with attractive dividends.", risks: "Nordic power price volatility." },
            { ticker: "NESTE", name: "Neste Oyj", exchange: "HEL", basePrice: 18.40, isWatchlist: true, revGrowth: 6.2, pe: 16.5, peg: 1.40, roe: 12.1, quick: 1.7, topHolders: "Finnish State (44.2%), Ilmarinen (4.1%)", flow3Day: "-150K sold", consider: "Global leader in renewable diesel and SAF production.", thesis: "Regulatory mandates requiring airlines to adopt low-carbon fuels.", risks: "Feedstock cost inflation." },
            { ticker: "UPM", name: "UPM-Kymmene Oyj", exchange: "HEL", basePrice: 31.50, isWatchlist: true, revGrowth: 5.1, pe: 17.2, peg: 1.35, roe: 9.8, quick: 1.8, topHolders: "Ilmarinen (4.2%), Varma (3.8%)", flow3Day: "+110K bought", consider: "Bioforest industry leader producing sustainable papers and pulp.", thesis: "Diversified bio-refining model transitioning to specialty materials.", risks: "Industrial packaging demand cyclicality." },
            { ticker: "INTC", name: "Intel Corporation", exchange: "NASDAQ", basePrice: 22.40, isWatchlist: true, revGrowth: -2.1, pe: -1, peg: -1, roe: -4.2, quick: 1.1, topHolders: "Vanguard (8.9%), BlackRock (7.8%)", flow3Day: "-1.2M sold", avoid: "Loss of server CPU market share and heavy capex drag.", thesis: "Negative free cash flow and structural foundry delays.", risks: "Loss of enterprise CPU market share and dividend cuts." },
            { ticker: "NKLA", name: "Nikola Corporation", exchange: "NASDAQ", basePrice: 0.38, isWatchlist: true, revGrowth: -34.0, pe: -1, peg: -1, roe: -45.0, quick: 0.42, topHolders: "Vanguard (2.1%), BlackRock (1.8%)", flow3Day: "-850K sold", avoid: "Severe ongoing cash burn and capital dilution.", thesis: "Severe balance sheet distress and dilution risk.", risks: "Insolvency risk and loss of liquidity." },
            { ticker: "AMC", name: "AMC Entertainment", exchange: "NYSE", basePrice: 3.85, isWatchlist: true, revGrowth: 2.1, pe: -1, peg: -1, roe: -22.0, quick: 0.48, topHolders: "Vanguard (4.2%), BlackRock (3.8%)", flow3Day: "-410K sold", avoid: "Extreme share dilution history and long-term debt burden.", thesis: "Debt load exceeds valuation with negative return on equity.", risks: "Continuous equity dilution and interest expenses." }
        ];

        let evaluatedStockDatabase = [];
        let livePricesFetched = {};
        let currentActiveTab = 'agents';

        function getActiveStockPool() {
            const savedCustom = localStorage.getItem('ruivo_custom_tickers');
            let customList = savedCustom ? JSON.parse(savedCustom) : [];
            const combined = [...defaultStockPool, ...customList];
            const uniqueMap = new Map();
            combined.forEach(s => {
                if (!uniqueMap.has(s.ticker.toUpperCase())) {
                    uniqueMap.set(s.ticker.toUpperCase(), s);
                }
            });
            return Array.from(uniqueMap.values());
        }

        async function fetchLiveMarketDataBatch() {
            const pool = getActiveStockPool();
            const tickersToFetch = pool.map(s => s.ticker).slice(0, 15);
            
            for (let t of tickersToFetch) {
                try {
                    const res = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${t}&apikey=${EMBEDDED_AV_KEY}`);
                    const data = await res.json();
                    if (data["Global Quote"] && data["Global Quote"]["05. price"]) {
                        const fetchedPrice = parseFloat(data["Global Quote"]["05. price"]);
                        if (!isNaN(fetchedPrice) && fetchedPrice > 0) {
                            livePricesFetched[t] = fetchedPrice;
                        }
                    }
                } catch(e) {
                    console.log("Error fetching quote for " + t, e);
                }
            }
            evaluateLiveMarketData();
            renderStockList(document.getElementById('searchInput').value);
        }

        function addNewWatchlistTicker() {
            const input = document.getElementById('newTickerInput');
            const ticker = input.value.trim().toUpperCase();
            if (!ticker) return;

            const currentPool = getActiveStockPool();
            if (currentPool.some(s => s.ticker === ticker)) {
                alert(`Ticker ${ticker} is already in your watchlist!`);
                input.value = '';
                return;
            }

            const newStockObj = {
                ticker: ticker,
                name: ticker + " Corporation",
                exchange: "US",
                basePrice: 85.50,
                isWatchlist: true,
                revGrowth: 22.0,
                pe: 21.5,
                peg: 1.10,
                roe: 18.5,
                quick: 1.9,
                topHolders: "Vanguard (6.5%), BlackRock (5.8%)",
                flow3Day: "+350K bought",
                consider: `Dynamically added custom watchlist asset.`,
                thesis: `Technical and Fundamental Agents confirm stable consolidation.`,
                risks: `Macro economic headwinds and valuation sensitivity.`
            };

            const savedCustom = localStorage.getItem('ruivo_custom_tickers');
            let customList = savedCustom ? JSON.parse(savedCustom) : [];
            customList.push(newStockObj);
            localStorage.setItem('ruivo_custom_tickers', JSON.stringify(customList));

            input.value = '';
            evaluateLiveMarketData();
            renderStockList('');
        }

        function evaluateLiveMarketData() {
            const pool = getActiveStockPool();
            evaluatedStockDatabase = pool.map(stock => {
                const livePrice = livePricesFetched[stock.ticker] ? livePricesFetched[stock.ticker] : stock.basePrice;
                const supportLevel = Number((livePrice * 0.92).toFixed(2));
                
                const passRev = stock.revGrowth >= 10;
                const passPE = stock.pe > 0 && stock.pe < 30;
                const passPEG = stock.peg > 0 && stock.peg < 2.0;
                const passROE = stock.roe > 5.0;
                const passQuick = stock.quick > 1.5;

                let fundPassCount = 0;
                if (passRev) fundPassCount++;
                if (passPE) fundPassCount++;
                if (passPEG) fundPassCount++;
                if (passROE) fundPassCount++;
                if (passQuick) fundPassCount++;

                const isAvoidCandidate = stock.avoid || fundPassCount < 2 || stock.revGrowth < 0 || stock.quick < 1.0;

                let score = 50 + (fundPassCount * 8) + (stock.revGrowth > 20 ? 10 : 0);
                if (isAvoidCandidate) score = Math.min(score, 42);
                score = Math.min(98, Math.max(15, Math.round(score)));

                const signalText = isAvoidCandidate ? "AVOID / HIGH RISK" : (score >= 85 ? "STRONG IN" : "IN");
                const fundText = isAvoidCandidate ? `❌ ${fundPassCount}/5 Fundamental Pass` : `✅ ${fundPassCount}/5 Fundamental Pass`;
                const rsiVal = (45 + (score > 75 ? 12 : -8)).toFixed(1);

                return {
                    ...stock,
                    price: livePrice,
                    isRealtime: !!livePricesFetched[stock.ticker],
                    support: supportLevel,
                    score: score,
                    signal: signalText,
                    fund: fundText,
                    fundPassCount: fundPassCount,
                    rsiVal: rsiVal,
                    isAvoid: isAvoidCandidate,
                    tech: `RSI ${rsiVal} | Support near $${supportLevel.toFixed(2)}`,
                    sentiment: `${score > 70 ? '+' : '-'}3.4% Institutional Flow`,
                    fundamental: `Rev ${stock.revGrowth > 0 ? '+' : ''}${stock.revGrowth}% | P/E ${stock.pe > 0 ? stock.pe : 'N/A'}`,
                    macro: "Sector capital expenditure & macroeconomic trends",
                    riskMgr: isAvoidCandidate ? "Downside Risk Trigger Active" : `Stop Loss: $${(livePrice * 0.88).toFixed(2)}`
                };
            });
        }

        function renderStockList(query = '') {
            const container = document.getElementById('stockList');
            const trimmedQuery = query.toLowerCase().trim();

            if (currentActiveTab === 'stats') {
                renderStatsTable(container, trimmedQuery);
                return;
            }

            let activePool = [];
            if (currentActiveTab === 'agents') {
                activePool = evaluatedStockDatabase
                    .filter(s => !s.isAvoid)
                    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
            } else {
                activePool = evaluatedStockDatabase
                    .filter(s => s.isAvoid)
                    .sort((a, b) => a.score - b.score || a.name.localeCompare(b.name));
            }

            let filtered = activePool.filter(stock => 
                stock.ticker.toLowerCase().includes(trimmedQuery) || 
                stock.name.toLowerCase().includes(trimmedQuery)
            );

            let html = '';
            filtered.forEach(stock => {
                const isAvoid = currentActiveTab === 'avoid';
                const cardClass = isAvoid ? 'stock-card card-avoid' : 'stock-card';
                const badgeClass = isAvoid ? 'signal-badge signal-avoid' : 'signal-badge signal-in';
                const scoreColor = isAvoid ? 'color:var(--accent-red);' : 'color:var(--accent-green);';
                const fundBadgeClass = stock.fund.includes('❌') ? 'fund-badge fail' : 'fund-badge';
                const agentTitleClass = isAvoid ? 'agent-title avoid' : 'agent-title';

                html += `
                    <div class="${cardClass}">
                        <div class="stock-header">
                            <span class="stock-ticker">${stock.name} (${stock.exchange}: ${stock.ticker})</span>
                            <span class="${badgeClass}">${stock.signal}</span>
                        </div>
                        <div class="stock-metrics">
                            <div><span class="metric-label">Price ${stock.isRealtime ? '<span class="live-tag">LIVE</span>' : ''}</span><span class="metric-val">$${stock.price.toFixed(2)}</span></div>
                            <div><span class="metric-label">Support</span><span class="metric-val">$${stock.support.toFixed(2)}</span></div>
                            <div><span class="metric-label">Score</span><span class="metric-val" style="${scoreColor}">${stock.score}/100</span></div>
                        </div>
                        <div class="${fundBadgeClass}">${stock.fund}</div>

                        <div class="investor-box">
                            <strong>🏛️ Top Investors:</strong> ${stock.topHolders}<br>
                            <strong>📊 3-Day Flow:</strong> ${stock.flow3Day}
                        </div>

                        ${isAvoid ? 
                            `<div class="avoid-box"><strong>🚫 Why Avoid:</strong> ${stock.avoid}</div>` : 
                            `<div class="consider-box"><strong>💡 Why Consider:</strong> ${stock.consider}</div>`
                        }
                        <div class="thesis-box"><strong>Thesis:</strong> ${stock.thesis}</div>
                        <div class="risk-box"><strong>⚠️ Risks:</strong> ${stock.risks}</div>

                        <div class="agent-grid">
                            <div class="agent-box"><span class="${agentTitleClass}">📈 Technical</span>${stock.tech}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">💬 Sentiment</span>${stock.sentiment}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">📊 Fundamental</span>${stock.fundamental}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">🌐 Macro</span>${stock.macro}</div>
                            <div class="agent-box" style="grid-column: span 2;"><span class="${agentTitleClass}">🛡️ Risk Manager</span>${stock.riskMgr}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || '<p style="text-align:center; color:var(--text-muted); padding:20px;">No stocks match your search query.</p>';
        }

        function renderStatsTable(container, query) {
            const allWatchlistStocks = evaluatedStockDatabase
                .filter(s => s.isWatchlist)
                .sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));

            const uniqueMap = new Map();
            allWatchlistStocks.forEach(s => {
                if (!uniqueMap.has(s.ticker)) uniqueMap.set(s.ticker, s);
            });
            const deduplicated = Array.from(uniqueMap.values());

            const filtered = deduplicated.filter(stock => 
                stock.ticker.toLowerCase().includes(query) || 
                stock.name.toLowerCase().includes(query)
            );

            let tableHtml = `
                <div class="section-header">📊 All Watchlist Stocks (${filtered.length} Assets)</div>
                <div class="stats-table-wrapper">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Asset Name & Ticker</th>
                                <th>Price</th>
                                <th>Support</th>
                                <th>5-Step</th>
                                <th>P/E</th>
                                <th>Quick</th>
                                <th>RSI</th>
                                <th>Score</th>
                                <th>Signal</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filtered.forEach(s => {
                const signalClass = s.isAvoid ? 'signal-badge signal-avoid' : 'signal-badge signal-in';
                const scoreColor = s.isAvoid ? 'color:var(--accent-red);' : 'color:var(--accent-green);';

                tableHtml += `
                    <tr>
                        <td><strong>${s.name}</strong> (${s.ticker})</td>
                        <td>$${s.price.toFixed(2)} ${s.isRealtime ? '🟢' : ''}</td>
                        <td>$${s.support.toFixed(2)}</td>
                        <td>${s.fundPassCount}/5</td>
                        <td>${s.pe > 0 ? s.pe : 'N/A'}</td>
                        <td>${s.quick}</td>
                        <td>${s.rsiVal}</td>
                        <td><strong style="${scoreColor}">${s.score}</strong></td>
                        <td><span class="${signalClass}" style="font-size:0.6rem; padding:2px 4px;">${s.signal}</span></td>
                    </tr>
                `;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = tableHtml;
        }

        function handleDynamicSearch() {
            renderStockList(document.getElementById('searchInput').value);
        }

        function switchTab(tab) {
            currentActiveTab = tab;
            document.getElementById('btnAgents').className = tab === 'agents' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnStats').className = tab === 'stats' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnAvoid').className = tab === 'avoid' ? 'tab-btn avoid-active' : 'tab-btn';
            renderStockList(document.getElementById('searchInput').value);
        }

        window.onload = async function() {
            evaluateLiveMarketData();
            renderStockList('');
            await fetchLiveMarketDataBatch();
        };
    </script>
</body>
</html>
