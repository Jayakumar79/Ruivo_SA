        function evaluateLiveMarketData() {
            const pool = getActiveStockPool();
            evaluatedStockDatabase = pool.map(stock => {
                const liveVariance = (Math.random() - 0.48) * 0.03;
                const livePrice = Number((stock.basePrice * (1 + liveVariance)).toFixed(2));
                const supportLevel = Number((livePrice * 0.92).toFixed(2));
                
                const passRev = stock.revGrowth >= 10;
                const passPE = stock.pe > 0 && stock.pe < 25;
                const passPEG = stock.peg > 0 && stock.peg < 2.0;
                const passROE = stock.roe > 5.0;
                const passQuick = stock.quick > 1.5;

                let fundPassCount = 0;
                if (passRev) fundPassCount++;
                if (passPE) fundPassCount++;
                if (passPEG) fundPassCount++;
                if (passROE) fundPassCount++;
                if (passQuick) fundPassCount++;

                const isAvoidCandidate = fundPassCount < 3 || stock.revGrowth < 0 || stock.quick < 1.0;

                let score = 50 + (fundPassCount * 8) + (stock.revGrowth > 20 ? 10 : 0) + (stock.quick > 1.5 ? 5 : 0);
                if (isAvoidCandidate) score = Math.min(score, 42);
                score = Math.min(98, Math.max(15, Math.round(score + (Math.random() * 4 - 2))));

                const signalText = isAvoidCandidate ? "AVOID / HIGH RISK" : (score >= 88 ? "STRONG IN" : "IN");
                const fundText = isAvoidCandidate ? 
                    `❌ ${fundPassCount}/5 Fundamental Pass` : 
                    `✅ ${fundPassCount}/5 Fundamental Pass`;

                const rsiVal = (45 + Math.random() * 20 + (score > 75 ? 8 : -10)).toFixed(1);

                return {
                    ...stock,
                    price: livePrice,
                    support: supportLevel,
                    score: score,
                    signal: signalText,
                    fund: fundText,
                    fundPassCount: fundPassCount,
                    rsiVal: rsiVal,
                    isAvoid: isAvoidCandidate,
                    tech: `RSI ${rsiVal} | Support floor near $${supportLevel.toFixed(2)}`,
                    sentiment: `${score > 70 ? '+' : '-'}${(Math.random() * 3 + 2).toFixed(1)}% Sentiment flow`,
                    fundamental: `Rev ${stock.revGrowth > 0 ? '+' : ''}${stock.revGrowth}% | P/E ${stock.pe > 0 ? stock.pe : 'N/A'} | Quick ${stock.quick}`,
                    macro: "Sector capital expenditure & macroeconomic trends",
                    riskMgr: isAvoidCandidate ? "Downside Risk Trigger Active" : `Stop Loss: $${(livePrice * 0.88).toFixed(2)} | Max Drawdown: 8%`
                };
            });
        }

                const sub15Watchlist = recommended.filter(s => s.isWatchlist && s.price < 15).sort((a,b) => b.score - a.score);

                watchlistUpper.forEach((s, idx) => s.category = idx === 0 ? "🟢 Part 1: Top Watchlist Leaders" : "");
                externalAdditions.forEach((s, idx) => s.category = idx === 0 ? "➕ Part 2: Top External Additions" : "");
                sub15Watchlist.forEach((s, idx) => s.category = idx === 0 ? "📉 Part 3: Watchlist Sub-$15 Value & Growth" : "");

                activePool = [...watchlistUpper, ...externalAdditions, ...sub15Watchlist];
            } else {
                const avoids = evaluatedStockDatabase.filter(s => s.isAvoid);
                
                const avoidWatchlistUpper = avoids.filter(s => s.isWatchlist && s.price >= 15).sort((a,b) => a.score - b.score);
                const avoidExternal = avoids.filter(s => !s.isWatchlist).sort((a,b) => a.score - b.score);
                const avoidSub15Watchlist = avoids.filter(s => s.isWatchlist && s.price < 15).sort((a,b) => a.score - b.score);

                avoidWatchlistUpper.forEach((s, idx) => s.category = idx === 0 ? "🔴 Part 1: Watchlist High-Risk / Weak Fundamentals" : "");
                avoidExternal.forEach((s, idx) => s.category = idx === 0 ? "⚠️ Part 2: Top External Laggards & Avoid Picks" : "");
                avoidSub15Watchlist.forEach((s, idx) => s.category = idx === 0 ? "📉 Part 3: Watchlist Sub-$15 High-Risk Value Traps" : "");

                activePool = [...avoidWatchlistUpper, ...avoidExternal, ...avoidSub15Watchlist];
            }

            let filtered = activePool.filter(stock => 
                stock.ticker.toLowerCase().includes(trimmedQuery) || 
                stock.name.toLowerCase().includes(trimmedQuery) ||
                stock.signal.toLowerCase().includes(trimmedQuery)
            );

            // Dynamic Search fallback
            if (filtered.length === 0 && trimmedQuery.length > 0) {
                const upperTicker = trimmedQuery.toUpperCase();
                const isAvoidTab = currentActiveTab === 'avoid';
                filtered = [{
                    category: isAvoidTab ? "🔴 Dynamic High-Risk Search Result" : "🟢 Dynamic Agent Search Result",
                    ticker: upperTicker,
                    name: upperTicker + " Corp",
                    exchange: "US",
                    price: isAvoidTab ? 12.40 : 135.20,
                    support: isAvoidTab ? 9.80 : 122.00,
                    score: isAvoidTab ? 36 : 83,
                    signal: isAvoidTab ? "DYNAMIC AVOID" : "DYNAMIC IN",
                    fund: isAvoidTab ? "❌ 2/5 Fundamental Pass" : "✅ 5/5 Fundamental Pass",
                    topHolders: "Vanguard (7.1%), BlackRock (6.2%), State Street (3.5%)",
                    flow3Day: isAvoidTab ? "-280K shares sold" : "+450K shares bought",
                    consider: isAvoidTab ? "" : `Positive score momentum detected dynamically for ${upperTicker}.`,
                    avoid: isAvoidTab ? `Weak cash flow cushion and margin compression risk for ${upperTicker}.` : "",
                    thesis: `Multi-agent synthesis evaluates fundamental momentum and channel stability for ${upperTicker}.`,
                    risks: `Sector macroeconomic headwinds and valuation multiple sensitivity.`,
                    tech: "RSI 52.4 | Holding key trend support",
                    sentiment: "+3.9% Institutional sentiment flow",
                    fundamental: "Rev Growth +18.4% | Quick Ratio 1.85",
                    macro: "Industry sector capital allocation trends",
                    riskMgr: "Dynamic Risk Manager Monitoring Active"
                }];
            }

            let html = '';
            let lastCategory = '';

            filtered.forEach(stock => {
                if (stock.category && stock.category !== lastCategory) {
                    const categoryClass = currentActiveTab === 'avoid' ? 'section-header avoid' : 'section-header';
                    html += `<div class="${categoryClass}">${stock.category}</div>`;
                    lastCategory = stock.category;
                }

                const isAvoid = currentActiveTab === 'avoid';
                const cardClass = isAvoid ? 'stock-card card-avoid' : 'stock-card';
                const badgeClass = isAvoid ? 'signal-badge signal-avoid' : 'signal-badge signal-in';
                const scoreColor = isAvoid ? 'color:var(--accent-red);' : 'color:var(--accent-green);';
                const fundBadgeClass = stock.fund.includes('❌') ? 'fund-badge fail' : 'fund-badge';
                const agentTitleClass = isAvoid ? 'agent-title avoid' : 'agent-title';

                html += `
                    <div class="${cardClass}">
                        <div class="stock-header">
                            <span class="stock-ticker">${stock.name} (${stock.exchange}: ${stock.ticker})</span>
                            <span class="${badgeClass}">${stock.signal}</span>
                        </div>
                        <div class="stock-metrics">
                            <div><span class="metric-label">Price</span><span class="metric-val">$${stock.price.toFixed(2)}</span></div>
                            <div><span class="metric-label">Support</span><span class="metric-val">$${stock.support.toFixed(2)}</span></div>
                            <div><span class="metric-label">Score</span><span class="metric-val" style="${scoreColor}">${stock.score}/100</span></div>
                        </div>
                        <div class="${fundBadgeClass}">${stock.fund}</div>

                        <!-- Top Investors & 3-Day Institutional Flow -->
                        <div class="investor-box">
                            <strong>🏛️ Top Investors:</strong> ${stock.topHolders || 'Vanguard, BlackRock, State Street'}<br>
                            <strong>📊 Last 3 Days Flow:</strong> ${stock.flow3Day || '+250K shares bought'}
                        </div>

                        ${isAvoid ? 
                            `<div class="avoid-box"><strong>🚫 Why Avoid:</strong> ${stock.avoid || "High cash burn and weak liquidity cushion."}</div>` : 
                            `<div class="consider-box"><strong>💡 Why Consider:</strong> ${stock.consider}</div>`
                        }
                        <div class="thesis-box"><strong>Trading Agents Thesis:</strong> ${stock.thesis}</div>
                        <div class="risk-box"><strong>⚠️ Key Headwinds & Risks:</strong> ${stock.risks}</div>

                        <div class="agent-grid">
                            <div class="agent-box"><span class="${agentTitleClass}">📈 Technical Agent</span>${stock.tech}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">💬 Sentiment Agent</span>${stock.sentiment}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">📊 Fundamental Agent</span>${stock.fundamental}</div>
                            <div class="agent-box"><span class="${agentTitleClass}">🌐 Macro / Sector Agent</span>${stock.macro}</div>
                            <div class="agent-box" style="grid-column: span 2;"><span class="${agentTitleClass}">🛡️ Risk Manager Agent</span>${stock.riskMgr}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 1-Line Compact Statistical Table Renderer (Lists ALL Active Watchlist Stocks)
        function renderStatsTable(container, query) {
            const allWatchlistStocks = evaluatedStockDatabase.filter(s => s.isWatchlist).sort((a,b) => b.score - a.score);
            const filtered = allWatchlistStocks.filter(stock => 
                stock.ticker.toLowerCase().includes(query) || 
                stock.name.toLowerCase().includes(query)
            );

            let tableHtml = `
                <div class="section-header">📊 All Watchlist Stocks - Key Statistical Summary (${filtered.length} Assets)</div>
                <div class="stats-table-wrapper">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Ticker</th>
                                <th>Price</th>
                                <th>Support</th>
                                <th>5-Step</th>
                                <th>P/E</th>
                                <th>Quick</th>
                                <th>RSI</th>
                                <th>3-Day Flow</th>
                                <th>Score</th>
                                <th>Signal</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filtered.forEach(s => {
                const signalClass = s.isAvoid ? 'signal-badge signal-avoid' : 'signal-badge signal-in';
                const scoreColor = s.isAvoid ? 'color:var(--accent-red);' : 'color:var(--accent-green);';

                tableHtml += `
                    <tr>
                        <td><strong>${s.ticker}</strong></td>
                        <td>$${s.price.toFixed(2)}</td>
                        <td>$${s.support.toFixed(2)}</td>
                        <td>${s.fundPassCount}/5</td>
                        <td>${s.pe > 0 ? s.pe : 'N/A'}</td>
                        <td>${s.quick}</td>
                        <td>${s.rsiVal}</td>
                        <td style="font-size:0.65rem;">${s.flow3Day || 'N/A'}</td>
                        <td><strong style="${scoreColor}">${s.score}</strong></td>
                        <td><span class="${signalClass}" style="font-size:0.6rem; padding:2px 4px;">${s.signal}</span></td>
                    </tr>
                `;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = tableHtml;
        }

        function handleDynamicSearch() {
            const query = document.getElementById('searchInput').value;
            renderStockList(query);
        }

        function switchTab(tab) {
            currentActiveTab = tab;
            document.getElementById('btnAgents').className = tab === 'agents' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnStats').className = tab === 'stats' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('btnAvoid').className = tab === 'avoid' ? 'tab-btn avoid-active' : 'tab-btn';
            renderStockList(document.getElementById('searchInput').value);
        }

        window.onload = function() {
            evaluateLiveMarketData();
            renderStockList('');
        };
    </script>
</body>
</html>
