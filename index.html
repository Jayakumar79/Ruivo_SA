<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruivo Stock Analytics v5.2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        accentGreen: '#10b981',
                        accentRed: '#ef4444',
                        accentBlue: '#3b82f6',
                        borderCol: '#1e293b'

    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .signal-in {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }
        .signal-watch {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }
        .signal-caution {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body class="p-3 sm:p-6 max-w-4xl mx-auto min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <div>
        <header class="text-center pb-4 border-b border-borderCol mb-5">
            <div class="flex items-center justify-center gap-2">
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    📈 Ruivo Stock Analytics 
                    <span class="text-xs bg-accentBlue text-white font-semibold px-2 py-0.5 rounded">v5.2</span>
                </h1>
            </div>
            <p class="text-xs sm:text-sm text-gray-400 mt-1">
                Dynamic Open-Search Engine & Multi-Agent Algorithmic Fundamental Analysis
            </p>
        </header>

        <!-- View Switching Tabs -->
        <div class="flex gap-2 mb-4">
            <button id="btnSignalView" onclick="switchView('signal')" class="flex-1 py-2 px-3 bg-accentBlue text-white rounded-lg text-xs sm:text-sm font-semibold border border-accentBlue transition hover:opacity-90">
                🔥 Multi-Agent Signal View
            </button>
            <button id="btnAgentsView" onclick="switchView('agents')" class="flex-1 py-2 px-3 bg-cardBg text-gray-400 rounded-lg text-xs sm:text-sm font-semibold border border-borderCol transition hover:text-white hover:border-gray-600">
                🧠 TradingAgents Framework
            </button>
        </div>

        <!-- Search Bar -->
        <div class="mb-5">
            <div class="relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="w-full px-4 py-3 bg-cardBg border border-accentBlue/60 rounded-xl text-white placeholder-gray-400 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-accentBlue transition shadow-lg"
                    placeholder="🔍 Search ANY ticker or name (e.g. TSLA, AAPL, MSFT, RKLB, AMD, NFLX)..."
                    oninput="handleSearch()"
                >
                <button 
                    onclick="clearSearch()" 
                    id="btnClear"
                    class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs bg-borderCol px-2 py-1 rounded"
                >
                    Clear
                </button>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2 text-[11px] text-gray-400">
                <span class="text-gray-500">Quick Search:</span>
                <button onclick="setSearch('NVDA')" class="hover:text-accentBlue underline">NVDA</button>
                <button onclick="setSearch('TSLA')" class="hover:text-accentBlue underline">TSLA</button>
                <button onclick="setSearch('AAPL')" class="hover:text-accentBlue underline">AAPL</button>
                <button onclick="setSearch('MSFT')" class="hover:text-accentBlue underline">MSFT</button>
                <button onclick="setSearch('PLTR')" class="hover:text-accentBlue underline">PLTR</button>
                <button onclick="setSearch('RKLB')" class="hover:text-accentBlue underline">RKLB</button>
                <button onclick="setSearch('AMD')" class="hover:text-accentBlue underline">AMD</button>
            </div>
        </div>

        <!-- Stock Cards Container -->
        <div id="stockList" class="space-y-4">
            <!-- Dynamic Stock Cards Rendered Here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 pt-4 border-t border-borderCol text-center text-xs text-gray-500">
        Ruivo Stock Analytics v5.2 • Powered by Dynamic TradingAgents Financial Simulation Rules
    </footer>

                whyConsider: "Category leader in eVTOL urban air mobility with FAA airworthiness testing milestones and DoD partnerships.",
                thesis: "First-mover advantage in commercial air taxi regulatory certification and manufacturing scaling.", 
                risks: "Aviation safety regulatory delays and pre-profit cash burn.", 
                tech: "RSI 49.8 | Base building above $5.10 support", 
                sentiment: "+4.0% FAA Stage 4 certification progress", 
                fundamental: "Rev +55% | Pre-Profit | Quick Ratio 5.2 | Debt/Eq 0.12", 
                macro: "Next-gen clean aviation and defense logistics", 
                riskMgr: "Stop Loss: $4.60 | Volatility Rating: High" 
            }
        ];

        let currentActiveView = 'signal';

        // Deterministic Financial Generator for Any Dynamic Ticker outside preset array
        function generateDynamicStock(tickerInput) {
            const rawTicker = tickerInput.trim().toUpperCase();
            
            // Generate deterministic numbers based on ticker hash
            let hash = 0;
            for (let i = 0; i < rawTicker.length; i++) {
                hash = rawTicker.charCodeAt(i) + ((hash << 5) - hash);
            }
            const positiveHash = Math.abs(hash);

            // Deterministic calculations
            const basePrice = (positiveHash % 280) + 12.50;
            const support = basePrice * 0.88;
            const rsi = (positiveHash % 35) + 40; // 40 - 75
            const revGrowth = (positiveHash % 85) + 8; // 8% - 93%
            const pe = (positiveHash % 30) + 14; // 14 - 44
            const peg = ((positiveHash % 15) / 10 + 0.5).toFixed(2); // 0.50 - 2.00
            const roe = (positiveHash % 32) + 6; // 6% - 38%
            const quickRatio = ((positiveHash % 25) / 10 + 1.1).toFixed(2); // 1.10 - 3.60
            const score = (positiveHash % 25) + 73; // 73 - 98

            // Determine pass count & badges
            const passRev = revGrowth >= 10;
            const passPE = pe < 30;
            const passPEG = parseFloat(peg) <= 1.8;
            const passROE = roe > 5;
            const passQuick = parseFloat(quickRatio) >= 1.2;
            
            let passCount = 0;
            if (passRev) passCount++;
            if (passPE) passCount++;
            if (passPEG) passCount++;
            if (passROE) passCount++;
            if (passQuick) passCount++;

            let signal = "STRONG IN";
            let signalType = "in";
            if (passCount === 4) {
                signal = "BUY ON DIPS";
                signalType = "watch";
            } else if (passCount < 4) {
                signal = "WATCHLIST";
                signalType = "watch";
            }

            const fundText = `${passCount === 5 ? '✅ 5/5' : '⚠️ ' + passCount + '/5'} Fundamental Pass (Rev +${revGrowth}%, P/E ${pe}, Quick ${quickRatio})`;

            return {
                ticker: rawTicker,
                name: `${rawTicker} Corp / Inc`,
                exchange: rawTicker.length <= 3 ? "NYSE" : "NASDAQ",
                price: parseFloat(basePrice.toFixed(2)),
                support: parseFloat(support.toFixed(2)),
                score: score,
                signal: signal,
                signalType: signalType,
                fund: fundText,
                whyConsider: `Strong quantitative alignment with ${rawTicker}'s market segment growth, healthy liquidity buffer (Quick Ratio ${quickRatio}), and institutional expansion indicators.`,
                thesis: `TradingAgents Framework confirms positive valuation efficiency for ${rawTicker}. Momentum metrics point to steady accumulation near the $${support.toFixed(2)} support level.`,
                risks: `Macro interest rate volatility, industry peer competition, and short-term resistance near $${(basePrice * 1.12).toFixed(2)}.`,
                tech: `RSI ${rsi.toFixed(1)} | Support level dynamic at $${support.toFixed(2)} | MACD neutral-bullish`,
                sentiment: `+${(positiveHash % 4 + 2).toFixed(1)}% Positive social & news sentiment velocity`,
                fundamental: `Rev +${revGrowth}% | P/E ${pe} | PEG ${peg} | Quick Ratio ${quickRatio} | ROE ${roe}%`,
                macro: `Sector tailwinds favoring resilient business models in current macroeconomic landscape`,
                riskMgr: `Stop Loss: $${(support * 0.95).toFixed(2)} | Volatility Rating: Moderate`
            };
        }

        // Render function handling both preset search and dynamic fallbacks
        function renderStockList() {
            const container = document.getElementById('stockList');
            const searchInput = document.getElementById('searchInput');
            const query = searchInput.value.trim().toLowerCase();
            const btnClear = document.getElementById('btnClear');

            if (query.length > 0) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
            }

            let displayList = [];

            if (query === '') {
                displayList = presetDatabase;
            } else {
                // Filter presets
                const filteredPresets = presetDatabase.filter(s => 
                    s.ticker.toLowerCase().includes(query) || 
                    s.name.toLowerCase().includes(query)
                );

                if (filteredPresets.length > 0) {
                    displayList = filteredPresets;
                } else {
                    // Generate dynamic stock evaluation if not in preset
                    const dynamicItem = generateDynamicStock(query);
                    displayList = [dynamicItem];
                }
            }

            let html = '';
            displayList.forEach(stock => {
                const isAgentsView = currentActiveView === 'agents';
                const signalClass = stock.signalType === 'in' ? 'signal-in' : (stock.signalType === 'watch' ? 'signal-watch' : 'signal-caution');

                html += `
                    <div class="bg-cardBg border border-borderCol rounded-xl p-4 sm:p-5 shadow-md hover:border-gray-700 transition">
                        <!-- Top Row: Ticker & Signal Badge -->
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <h3 class="text-base sm:text-lg font-bold text-white tracking-wide">
                                    ${stock.name} <span class="text-xs font-normal text-gray-400">(${stock.exchange}: ${stock.ticker})</span>
                                </h3>
                            </div>
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider ${signalClass}">
                                ${stock.signal}
                            </span>
                        </div>

                        <!-- Metrics Grid -->
                        <div class="grid grid-cols-3 gap-2 bg-black/30 p-2.5 rounded-lg text-xs my-3 border border-borderCol/50">
                            <div>
                                <span class="text-gray-400 block">Price</span>
                                <span class="text-white font-bold">$${stock.price.toFixed(2)}</span>
                            </div>
                            <div>
                                <span class="text-gray-400 block">Support</span>
                                <span class="text-white font-bold">$${stock.support.toFixed(2)}</span>
                            </div>
                            <div>
                                <span class="text-gray-400 block">Score</span>
                                <span class="text-accentGreen font-bold">${stock.score}/100</span>
                            </div>
                        </div>

                        <!-- Fundamental Badge -->
                        <div class="mb-3">
                            <span class="inline-block bg-accentBlue/10 text-accentBlue border border-accentBlue/20 text-xs px-2.5 py-1 rounded-md font-medium">
                                ${stock.fund}
                            </span>
                        </div>

                        <!-- Analysis Sections -->
                        <div class="space-y-2 text-xs sm:text-sm border-t border-borderCol pt-3">
                            <div>
                                <strong class="text-accentBlue font-semibold block sm:inline">Why Consider:</strong> 
                                <span class="text-gray-200">${stock.whyConsider}</span>
                            </div>
                            <div>
                                <strong class="text-gray-300 font-semibold block sm:inline">Multi-Agent Thesis:</strong> 
                                <span class="text-gray-400">${stock.thesis}</span>
                            </div>
                            <div>
                                <strong class="text-red-400 font-semibold block sm:inline">⚠️ Key Risks:</strong> 
                                <span class="text-red-300/80">${stock.risks}</span>
                            </div>
                        </div>

                        <!-- TradingAgents Framework Breakdown (Toggled via Tabs) -->
                        ${isAgentsView ? `
                            <div class="mt-4 pt-3 border-t border-dashed border-borderCol">
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">🧠 5-Agent Framework Breakdown</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                    <div class="bg-black/20 p-2 rounded border border-borderCol/40">
                                        <span class="text-accentBlue font-bold block mb-0.5">📈 Technical Agent</span>
                                        <span class="text-gray-300">${stock.tech}</span>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded border border-borderCol/40">
                                        <span class="text-accentBlue font-bold block mb-0.5">💬 Sentiment Agent</span>
                                        <span class="text-gray-300">${stock.sentiment}</span>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded border border-borderCol/40">
                                        <span class="text-accentBlue font-bold block mb-0.5">📊 Fundamental Agent</span>
                                        <span class="text-gray-300">${stock.fundamental}</span>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded border border-borderCol/40">
                                        <span class="text-accentBlue font-bold block mb-0.5">🌐 Macro / Sector Agent</span>
                                        <span class="text-gray-300">${stock.macro}</span>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded border border-borderCol/40 sm:col-span-2">
                                        <span class="text-accentBlue font-bold block mb-0.5">🛡️ Risk Manager Agent</span>
                                        <span class="text-gray-300">${stock.riskMgr}</span>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function handleSearch() {
            renderStockList();
        }

        function setSearch(ticker) {
            const input = document.getElementById('searchInput');
            input.value = ticker;
            renderStockList();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            renderStockList();
        }

        function switchView(view) {
            currentActiveView = view;
            const btnSignal = document.getElementById('btnSignalView');
            const btnAgents = document.getElementById('btnAgentsView');

            if (view === 'signal') {
                btnSignal.className = "flex-1 py-2 px-3 bg-accentBlue text-white rounded-lg text-xs sm:text-sm font-semibold border border-accentBlue transition hover:opacity-90";
                btnAgents.className = "flex-1 py-2 px-3 bg-cardBg text-gray-400 rounded-lg text-xs sm:text-sm font-semibold border border-borderCol transition hover:text-white hover:border-gray-600";
            } else {
                btnAgents.className = "flex-1 py-2 px-3 bg-accentBlue text-white rounded-lg text-xs sm:text-sm font-semibold border border-accentBlue transition hover:opacity-90";
                btnSignal.className = "flex-1 py-2 px-3 bg-cardBg text-gray-400 rounded-lg text-xs sm:text-sm font-semibold border border-borderCol transition hover:text-white hover:border-gray-600";
            }

            renderStockList();
        }

        // Initialize view on load
        window.onload = function() {
            renderStockList();
        };
    </script>
</body>
</html>
