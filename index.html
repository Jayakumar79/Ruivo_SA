<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruivo Stock Analytics - Multi-Agent Engine</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; max-width: 650px; margin: 0 auto; }
        header { text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        header h1 { font-size: 1.3rem; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .tab-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        .search-container { margin-bottom: 14px; }
        .search-bar { width: 100%; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--accent-blue); border-radius: 8px; color: white; font-size: 0.95rem; outline: none; }
        
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .stock-ticker { font-size: 0.95rem; font-weight: bold; }
        .signal-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .signal-in { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        
        .stock-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 0.75rem; margin: 8px 0; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .metric-label { color: var(--text-muted); display: block; }
        .metric-val { font-weight: bold; color: white; }

        .thesis-box { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; border-top: 1px solid var(--border-color); paddingTop: 6px; }
        .risk-box { font-size: 0.75rem; color: #f87171; margin-top: 4px; }
        .fund-badge { display: inline-block; background: rgba(59,130,246,0.15); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; margin-top: 6px; }
        
        .agent-view-container { display: none; }
        .agent-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; border-top: 1px dashed var(--border-color); padding-top: 8px; }
        .agent-box { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 6px 8px; font-size: 0.7rem; }
        .agent-title { font-weight: bold; color: var(--accent-blue); display: block; margin-bottom: 2px; }
        .no-results { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>📈 Ruivo Stock Analytics <span style="font-size: 0.7rem; background:#3b82f6; padding:2px 6px; border-radius:4px;">v5.1</span></h1>
        <p>TradingAgents Open-Search Engine & 5-Step Fundamental Filter</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="btnTop25" onclick="switchView('top25')">🔥 Multi-Agent Signal View</button>
        <button class="tab-btn" id="btnAgents" onclick="switchView('agents')">🧠 TradingAgents Framework</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search any stock ticker or name (e.g. NVDA, AAPL, TSLA, MSFT)..." onkeyup="handleDynamicSearch()">
    </div>

    <div id="stockList">
        <!-- Stock items will render dynamically via JavaScript search matching -->
    </div>

    <script>
        // Dynamic Master Watchlist Database for Open Search
        const stockDatabase = [

            { ticker: "TSM", name: "Taiwan Semiconductor", exchange: "NYSE", price: 194.30, support: 180.00, score: 89, signal: "STRONG IN", fund: "✅ 5/5 Fundamental Pass (Rev +28.5%, P/E 22.1, ROE 26.4%)", thesis: "High yield performance across 3nm/2nm fabrication nodes with robust pricing power.", risks: "Geopolitical regional concentration risks in Taiwan.", tech: "RSI 52.5 | Holding above $180 support", sentiment: "+4.1% High foundry utilization rate", fundamental: "Rev +28.5% | P/E 22.1 | Quick Ratio 1.9", macro: "Global semiconductor node dominance", riskMgr: "Stop Loss: $170.00 | Max Drawdown Limit: 9%" },
            { ticker: "PLTR", name: "Palantir Technologies", exchange: "NASDAQ", price: 186.03, support: 178.00, score: 88, signal: "STRONG IN", fund: "⚠️ 4/5 Fundamental Pass (P/E 42 High)", thesis: "AIP bootcamps accelerating U.S. commercial revenue alongside defense contract expansion.", risks: "Premium P/E multiple leaves short-term volatility vulnerable.", tech: "RSI 62.1 (Bullish) | Strong upward momentum", sentiment: "+5.2% Commercial bootcamp momentum", fundamental: "Rev +27% | P/E 42 (High) | Quick Ratio 4.8", macro: "Government defense digitization budget", riskMgr: "Stop Loss: $168.00 | Volatility Rating: High" },
            { ticker: "CEG", name: "Constellation Energy", exchange: "NASDAQ", price: 271.37, support: 255.00, score: 88, signal: "STRONG IN", fund: "✅ 5/5 Fundamental Pass (Rev +15.1%, P/E 23.8, Quick 1.65)", thesis: "Structural baseload nuclear power demand for hyperscale AI compute clusters.", risks: "Regulatory review timelines and power purchase agreement policies.", tech: "RSI 54.2 | Consolidating above $255 support", sentiment: "+4.5% Clean energy supply interest", fundamental: "Rev +15.1% | P/E 23.8 | Quick Ratio 1.65", macro: "Nuclear power purchase agreements", riskMgr: "Stop Loss: $242.00 | Max Drawdown Limit: 7%" },

            { ticker: "SMCI", name: "Super Micro Computer", exchange: "NASDAQ", price: 48.50, support: 42.00, score: 88, signal: "HIGH MOMENTUM", fund: "✅ 5/5 Fundamental Pass (Rev +143%, P/E 16.5, ROE 28.1%)", thesis: "Fast-to-market liquid-cooled server racks optimized for dense multi-GPU server deployments.", risks: "High volatility and server assembly margin pressures.", tech: "RSI 59.8 | Rebounding from $42 support level", sentiment: "+4.8% Liquid-cooled rack shipments", fundamental: "Rev +143% | P/E 16.5 | Quick Ratio 1.8", macro: "AI server rack infrastructure demand", riskMgr: "Stop Loss: $38.50 | Volatility: Very High" },
            { ticker: "AMPX", name: "Amprius Technologies", exchange: "NYSE", price: 7.71, support: 7.25, score: 80, signal: "GROWTH", fund: "⚠️ 4/5 Fundamental Pass (Pre-Profit P/E N/A)", thesis: "Silicon nanowire anode cells providing ultra-high energy density for aerospace and drone contracts.", risks: "Capital dilution hazards and pre-profit scaling timelines.", tech: "RSI 52.4 | Neutral consolidation near $7.25 support", sentiment: "+4.2% Military drone battery interest", fundamental: "Rev +108% | PEG 0.65 | Quick Ratio 3.1", macro: "High-performance aviation batteries", riskMgr: "Stop Loss: $6.60 | Volatility: High" },
            { ticker: "ONDS", name: "Ondas Inc", exchange: "NASDAQ", price: 6.85, support: 6.00, score: 78, signal: "DRONE TECH", fund: "⚠️ 4/5 Fundamental Pass (Pre-Profit P/E N/A)", thesis: "Private wireless networks and autonomous drone security solutions for critical infrastructure.", risks: "Micro-cap trading volume volatility and extended sales cycles.", tech: "RSI 50.1 | Consolidating above $6.00 support", sentiment: "+3.9% Rail & critical infrastructure orders", fundamental: "Rev +42% | PEG 0.85 | Quick Ratio 2.2", macro: "Automated security drone adoption", riskMgr: "Stop Loss: $5.40 | Volatility: High" },
            { ticker: "ENVX", name: "Enovix Corp", exchange: "NASDAQ", price: 2.49, support: 2.20, score: 77, signal: "UPSIDE RECOVERY", fund: "⚠️ 4/5 Fundamental Pass (Pre-Profit P/E N/A)", thesis: "Breakthrough 100% active silicon anode battery architecture with multi-bagger upside potential.", risks: "Manufacturing yield scaling execution risk.", tech: "RSI 44.2 | Oversold bounce near $2.20 double bottom", sentiment: "+4.4% Consumer electronics sampling", fundamental: "Rev +65% | PEG 0.52 | Quick Ratio 4.1", macro: "Next-gen smartphone battery tech", riskMgr: "Stop Loss: $1.95 | Volatility: High" },
            { ticker: "NOK", name: "Nokia Oyj", exchange: "NYSE", price: 4.65, support: 4.20, score: 75, signal: "STABLE VALUE", fund: "✅ 5/5 Fundamental Pass (Rev +10.2%, P/E 14.1, ROE 9.8%)", thesis: "High dividend reliability and solid optical/5G network infrastructure contracts globally.", risks: "Sluggish carrier capital spending cycles for telecom gear.", tech: "RSI 48.5 | Stable trend above $4.20 support", sentiment: "+3.1% Reliable dividend yield appeal", fundamental: "Rev +10.2% | P/E 14.1 | Quick Ratio 1.75", macro: "Global 5G & optical network upgrades", riskMgr: "Stop Loss: $3.90 | Max Drawdown Limit: 6%" },
            { ticker: "JOBY", name: "Joby Aviation", exchange: "NYSE", price: 4.66, support: 4.40, score: 74, signal: "eVTOL LEADER", fund: "⚠️ 4/5 Fundamental Pass (Pre-Profit P/E N/A)", thesis: "First-mover advantage in commercial FAA air taxi certification and flight-testing milestones.", risks: "Strict aviation safety regulatory approvals and cash burn timelines.", tech: "RSI 49.8 | Neutral consolidation near $4.40 support", sentiment: "+4.0% FAA flight testing milestones", fundamental: "Rev +55% | PEG 0.90 | Quick Ratio 5.2", macro: "Electric vertical takeoff air taxi sector", riskMgr: "Stop Loss: $3.95 | Volatility: High" }
        ];

        let currentActiveView = 'top25';

        function renderStockList(query = '') {
            const container = document.getElementById('stockList');
            const trimmedQuery = query.toLowerCase().trim();

            // Filter database dynamically based on open search query
            const filtered = stockDatabase.filter(stock => 
                stock.ticker.toLowerCase().includes(trimmedQuery) || 
                stock.name.toLowerCase().includes(trimmedQuery) ||
                stock.signal.toLowerCase().includes(trimmedQuery)
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-results">No matching stock found for "<strong>${query}</strong>". Try another ticker (e.g., NVDA, MU, NOK).</div>`;
                return;
            }

            let html = '';
            filtered.forEach(stock => {
                const showAgents = currentActiveView === 'agents' ? 'display: grid;' : 'display: none;';
                html += `
                    <div class="stock-card">
                        <div class="stock-header">
                            <span class="stock-ticker">${stock.name} (${stock.exchange}: ${stock.ticker})</span>
                            <span class="signal-badge signal-in">${stock.signal}</span>
                        </div>
                        <div class="stock-metrics">
                            <div><span class="metric-label">Price</span><span class="metric-val">$${stock.price.toFixed(2)}</span></div>
                            <div><span class="metric-label">Support</span><span class="metric-val">$${stock.support.toFixed(2)}</span></div>
                            <div><span class="metric-label">Score</span><span class="metric-val" style="color:var(--accent-green);">${stock.score}/100</span></div>
                        </div>
                        <div class="fund-badge">${stock.fund}</div>
                        <div class="thesis-box"><strong>Multi-Agent Thesis:</strong> ${stock.thesis}</div>
                        <div class="risk-box"><strong>⚠️ Key Risks:</strong> ${stock.risks}</div>

                        <div class="agent-view-container agent-grid" style="${showAgents}">
                            <div class="agent-box"><span class="agent-title">📈 Technical Agent</span>${stock.tech}</div>
                            <div class="agent-box"><span class="agent-title">💬 Sentiment Agent</span>${stock.sentiment}</div>
                            <div class="agent-box"><span class="agent-title">📊 Fundamental Agent</span>${stock.fundamental}</div>
                            <div class="agent-box"><span class="agent-title">🌐 Macro / Sector Agent</span>${stock.macro}</div>
                            <div class="agent-box" style="grid-column: span 2;"><span class="agent-title">🛡️ Risk Manager Agent</span>${stock.riskMgr}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function handleDynamicSearch() {
            const query = document.getElementById('searchInput').value;
            renderStockList(query);
        }

        function switchView(view) {
            currentActiveView = view;
            document.getElementById('btnTop25').classList.remove('active');
            document.getElementById('btnAgents').classList.remove('active');
            
            if (view === 'top25') {
                document.getElementById('btnTop25').classList.add('active');
            } else {
                document.getElementById('btnAgents').classList.add('active');
            }
            const query = document.getElementById('searchInput').value;
            renderStockList(query);
        }

        // Initialize default render on load
        window.onload = function() {
            renderStockList('');
        };
    </script>
</body>
</html>
